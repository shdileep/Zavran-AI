<script>
    (function() {
      // Dynamic timer
      let minutes = 24;
      let seconds = 18;
      const clockEl = document.getElementById('session-clock');
      if (clockEl) {
        setInterval(() => {
          seconds++;
          if (seconds >= 60) {
            minutes++;
            seconds = 0;
          }
          clockEl.textContent = `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
        }, 1000);
      }

      // Mic Toggle
      const micBtn = document.getElementById('mic-toggle-btn');
      const micIcon = document.getElementById('mic-icon');
      const micLabel = document.getElementById('mic-label');
      let isMuted = false;

      if (micBtn && micIcon && micLabel) {
        micBtn.addEventListener('click', () => {
          isMuted = !isMuted;
          if (isMuted) {
            micIcon.textContent = 'mic_off';
            micIcon.classList.remove('text-primary');
            micIcon.classList.add('text-error');
            micLabel.textContent = 'Unmute';
            micBtn.classList.add('bg-error-container/30');
          } else {
            micIcon.textContent = 'mic';
            micIcon.classList.add('text-primary');
            micIcon.classList.remove('text-error');
            micLabel.textContent = 'Mute';
            micBtn.classList.remove('bg-error-container/30');
          }
        });
      }

      // End call action
      const endBtn = document.getElementById('end-interview-btn');
      if (endBtn) {
        endBtn.addEventListener('click', () => {
          if (confirm('Are you sure you want to conclude this interview session? Your assessment metrics will be synthesized.')) {
            endBtn.innerHTML = '<span class="material-symbols-outlined text-body-md animate-spin">sync</span><span>Synthesizing...</span>';
            endBtn.classList.add('opacity-75', 'pointer-events-none');
          }
        });
      }
    })();
  </script>
