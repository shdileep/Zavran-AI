<style data-purpose="static-orb-fluid-animation">
    /* 100% Rigid stationary orb container: no rotate, wobble, or position shift */
    .orb-container {
      width: 72px;
      height: 72px;
      position: relative;
      margin: 0 auto;
      border-radius: 9999px;
      overflow: hidden;
      clip-path: circle(50% at 50% 50%);
      -webkit-clip-path: circle(50% at 50% 50%);
      transform: none !important;
      isolation: isolate;
      flex-shrink: 0;
    }

    /* Base orb static image - locked in place, never rotates */
    .static-orb-base {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: none !important;
      pointer-events: none;
    }

    /* Fluid wave internal motion layer 1 - gentle translation & morph only, NO ROTATION */
    .orb-fluid-wave-1 {
      position: absolute;
      inset: -20%;
      pointer-events: none;
      mix-blend-mode: soft-light;
      animation: fluidWaveDrift1 6s ease-in-out infinite alternate;
      border-radius: 40%;
    }

    /* Fluid wave internal motion layer 2 - secondary wave shimmer, NO ROTATION */
    .orb-fluid-wave-2 {
      position: absolute;
      inset: -25%;
      pointer-events: none;
      mix-blend-mode: overlay;
      animation: fluidWaveDrift2 8s ease-in-out infinite alternate;
      border-radius: 44%;
    }

    /* Blue persona fluid gradients */
    .fluid-blue-1 {
      background: radial-gradient(ellipse at 40% 40%, rgba(255, 255, 255, 0.8) 0%, rgba(96, 165, 250, 0.6) 40%, rgba(37, 99, 235, 0) 70%);
    }
    .fluid-blue-2 {
      background: radial-gradient(circle at 60% 65%, rgba(147, 197, 253, 0.7) 10%, rgba(59, 130, 246, 0.4) 50%, rgba(29, 78, 216, 0) 75%);
    }

    /* Purple persona fluid gradients */
    .fluid-purple-1 {
      background: radial-gradient(ellipse at 40% 40%, rgba(255, 255, 255, 0.8) 0%, rgba(192, 132, 252, 0.6) 40%, rgba(147, 51, 234, 0) 70%);
    }
    .fluid-purple-2 {
      background: radial-gradient(circle at 60% 65%, rgba(233, 213, 255, 0.7) 10%, rgba(168, 85, 247, 0.4) 50%, rgba(126, 34, 206, 0) 75%);
    }

    /* Teal persona fluid gradients */
    .fluid-teal-1 {
      background: radial-gradient(ellipse at 40% 40%, rgba(255, 255, 255, 0.8) 0%, rgba(45, 212, 191, 0.6) 40%, rgba(13, 148, 136, 0) 70%);
    }
    .fluid-teal-2 {
      background: radial-gradient(circle at 60% 65%, rgba(167, 243, 208, 0.7) 10%, rgba(20, 184, 166, 0.4) 50%, rgba(15, 118, 110, 0) 75%);
    }

    /* Internal liquid motion keyframes - strictly translation and scale, NO ROTATE */
    @keyframes fluidWaveDrift1 {
      0% {
        transform: translate3d(-6%, -5%, 0) scale(1);
      }
      50% {
        transform: translate3d(5%, 4%, 0) scale(1.08);
      }
      100% {
        transform: translate3d(-3%, 6%, 0) scale(0.96);
      }
    }

    @keyframes fluidWaveDrift2 {
      0% {
        transform: translate3d(4%, 6%, 0) scale(1.05);
      }
      50% {
        transform: translate3d(-5%, -4%, 0) scale(0.95);
      }
      100% {
        transform: translate3d(6%, -3%, 0) scale(1.06);
      }
    }

    /* Glass specular surface shine - completely fixed/static to anchor spherical glass illusion */
    .glass-specular-fixed {
      position: absolute;
      inset: 0;
      border-radius: 9999px;
      pointer-events: none;
      box-shadow: inset 0 2px 5px rgba(255, 255, 255, 0.85),
                  inset 0 -3px 8px rgba(15, 23, 42, 0.35),

      background: radial-gradient(circle at 35% 25%, rgba(255, 255, 255, 0.65) 0%, rgba(255, 255, 255, 0.15) 35%, rgba(255, 255, 255, 0) 60%);
    }
  </style>

<script data-purpose="card-selection">
    // Interactive card selection
    document.querySelectorAll('.persona-card').forEach(card => {
      card.addEventListener('click', (e) => {
        if (e.target.closest('button')) return;

        document.querySelectorAll('.persona-card').forEach(c => {
          c.classList.remove('border-2', 'border-slate-950', 'shadow-card-active');
          c.classList.add('border', 'border-slate-200');
        });

        card.classList.remove('border', 'border-slate-200');
        card.classList.add('border-2', 'border-slate-950', 'shadow-card-active');
      });
    });
  </script>
